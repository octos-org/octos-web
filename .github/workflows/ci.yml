name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # eslint exits nonzero only on errors; the react-hooks v6 strict rules
      # are intentionally warnings (see eslint.config.js).
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm run build

  # UI-redesign smoke gate (#303). These specs run against a fully mocked
  # backend (page.route + routeWebSocket) — no live octos core needed, so
  # they can gate every PR cheaply. Without this job the spec directory
  # drifted silently from 3 red (2026-08-15) to 6 red (2026-08-26).
  e2e-smoke:
    name: e2e smoke and correctness (mocked backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      # The config owns root and /app/ Vite servers. It includes the existing
      # 24 smoke cases plus auth, preview, export, discovery and real VAD checks.
      - run: pnpm exec playwright test --config playwright.review.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/review/
          retention-days: 7
